<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions page</title>

    <link rel="stylesheet" href="questions.css">
    <script src="js/instascan.min.js"></script>
    <script src="cookies.js"></script>
</head>
<body>

<div style="margin: 20px; padding: 20px; background-color: black; color: white; text-align: center;" id="content">
    Scan a QR code to get a hint...
</div>

<div class="main-layout">

    <div class="question-card">
        <h1>Treasure Hunt Questions</h1>

        <div class="question-header">
            <h2>Treasure Hunt Question</h2>
            <div class="score-box">
                Score: <span id="score_container">0</span>
            </div>
        </div>

        <p id="question_text" class="question-text">
            Loading question...
        </p>

        <div id="answer_text" class="answers"></div>

        <p id="feedback_text" class="feedback"></p>
    </div>

    <div class="camera-container">
        <video id="preview" autoplay muted playsinline></video>
    </div>

</div>

<script>
const session = getCookie("sessionId");

let requiresLocationQuestion = false;
let locationSentQuestion = false;
let pendingAnswer = " ";
let cameraArray = [];
let cameraIndex = 0;

let isSubmitting = false;

function setFeedback(message, type = "info") {
    const feedback = document.getElementById("feedback_text");
    if (!feedback) return;

    feedback.textContent = message;

    // Safe readable colors (works on most backgrounds)
    if (type === "success") feedback.style.color = "#198754"; // green
    else if (type === "error") feedback.style.color = "#dc3545"; // red
    else feedback.style.color = "#111"; // dark for readability
}

function setButtonsEnabled(enabled) {
    const submitBtn = document.getElementById("submit");
    const skipBtn = document.getElementById("skipButton");
    if (submitBtn) submitBtn.disabled = !enabled;
    if (skipBtn) skipBtn.disabled = !enabled || skipBtn.dataset.locked === "true";
}

function ensureSession() {
    if (session) return true;

    document.getElementById("question_text").textContent = "Session missing. Please start the game again.";
    document.getElementById("answer_text").innerHTML = "";
    document.getElementById("score_container").textContent = "-";
    setFeedback("No active session found. Go back and start a new game session.", "error");
    return false;
}

// player score
function showPlayerScore() {
    if (!ensureSession()) return;

    fetch(`https://codecyprus.org/th/api/score?session=${session}`)
        .then(response => response.json())
        .then(jsonObject => {
            const score = document.getElementById('score_container');
            score.textContent = (typeof jsonObject.score !== "undefined") ? jsonObject.score : "-";
        })
        .catch(() => setFeedback("Network error while loading score.", "error"));
}

function buildAnswerUI(jsonObject) {
    let giveAnswer = document.getElementById("answer_text");
    giveAnswer.innerHTML = "";

    // Create correct control depending on question type
    let control;

    if (jsonObject.questionType === "MCQ") {
        // MCQ options are often inside questionText after <br>
        const select = document.createElement("select");
        select.id = "answer";

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Select an answer";
        select.appendChild(placeholder);

        const lines = (jsonObject.questionText || "").split("<br>").map(s => s.trim()).filter(Boolean);
        const optionLines = lines.slice(1); // after first line (question)

        optionLines.forEach(line => {
            // clean A. / B. / C. / D. prefixes if present
            const clean = line.replace(/^[A-D]\.\s*/i, "").trim();
            const opt = document.createElement("option");
            opt.value = clean;
            opt.textContent = clean;
            select.appendChild(opt);
        });

        control = select;
    } else {
        const input = document.createElement("input");
        input.id = "answer";

        if (jsonObject.questionType === "INTEGER" || jsonObject.questionType === "NUMERIC") {
            input.type = "number";
            input.placeholder = "Enter your answer";
        } else if (jsonObject.questionType === "BOOLEAN") {
            input.type = "text";
            input.placeholder = "Enter true / false";
        } else {
            input.type = "text";
            input.placeholder = "Enter your answer";
        }

        control = input;
    }

    giveAnswer.appendChild(control);

    const submitButton = document.createElement("button");
    submitButton.textContent = "Check";
    submitButton.id = "submit";
    submitButton.type = "button";
    submitButton.onclick = submitAnswers;
    giveAnswer.appendChild(submitButton);

    const skipButton = document.createElement("button");
    skipButton.textContent = "Skip Question";
    skipButton.type = "button";
    skipButton.onclick = skipQuestion;
    skipButton.id = "skipButton";
    giveAnswer.appendChild(skipButton);

    // If cannot be skipped -> disable button instead of annoying alert
    if (jsonObject.canBeSkipped === false) {
        skipButton.disabled = true;
        skipButton.dataset.locked = "true";
        setFeedback("This question cannot be skipped.", "info");
    } else {
        skipButton.dataset.locked = "false";
    }

    // Enter key submits (for input questions)
    control.addEventListener("keydown", (e) => {
        if (e.key === "Enter") submitAnswers();
    });
}

function getQuestions() {
    if (!ensureSession()) return;

    fetch(`https://codecyprus.org/th/api/question?session=${session}`)
        .then(response => response.json())
        .then(jsonObject => {
            console.log(jsonObject);

            requiresLocationQuestion = (jsonObject.requiresLocation === true);
            locationSentQuestion = false;

            let displayQuestion = document.getElementById("question_text");

            if (jsonObject.status !== "OK") {
                displayQuestion.textContent = "No questions found!";
                setFeedback("No questions found.", "error");
                return;
            }

            displayQuestion.textContent = (jsonObject.questionText || "").split("<br>")[0].trim();

            buildAnswerUI(jsonObject);
            setFeedback("", "info"); // clear old feedback

            // update score quickly
            setTimeout(showPlayerScore, 300);
        })
        .catch(() => setFeedback("Network error while loading question.", "error"));
}

function submitAnswers() {
    if (isSubmitting) return;
    if (!ensureSession()) return;

    const answerEl = document.getElementById("answer");
    const playersAnswers = (answerEl && answerEl.value) ? answerEl.value.trim() : "";

    if (!playersAnswers) {
        setFeedback("Please enter/select an answer.", "error");
        return;
    }

    pendingAnswer = playersAnswers;

    isSubmitting = true;
    setButtonsEnabled(false);

    const submitBtn = document.getElementById("submit");
    if (submitBtn) submitBtn.textContent = "Checking...";

    if (requiresLocationQuestion && !locationSentQuestion) {
        sendLocationAndAnswerQuestion();
        return;
    }

    fetch(`https://codecyprus.org/th/api/answer?session=${session}&answer=${encodeURIComponent(playersAnswers)}`)
        .then(response => response.json())
        .then(jsonObject => {
            console.log(jsonObject);

            if (jsonObject.status === "OK") {
                // Show clear correct/wrong if provided, else show API message
                if (jsonObject.correct === true) setFeedback("Correct ✅", "success");
                else if (jsonObject.correct === false) setFeedback("Wrong ❌", "error");
                else setFeedback(jsonObject.message || "Answer submitted.", "info");
            } else {
                setFeedback(jsonObject.message || "Something went wrong submitting the answer.", "error");
            }

            if (jsonObject.completed === false) {
                getQuestions();
            } else {
                window.location.href = "leaderboard.html";
            }

            setTimeout(showPlayerScore, 800);
        })
        .catch(() => setFeedback("Network error while submitting answer.", "error"))
        .finally(() => {
            isSubmitting = false;
            setButtonsEnabled(true);
            if (submitBtn) submitBtn.textContent = "Check";
        });
}

// skip
function skipQuestion() {
    if (isSubmitting) return;
    if (!ensureSession()) return;

    isSubmitting = true;
    setButtonsEnabled(false);

    fetch(`https://codecyprus.org/th/api/skip?session=${session}`)
        .then(response => response.json())
        .then(jsonObject => {
            console.log(jsonObject);

            setFeedback("Question skipped.", "info");
            getQuestions();
            setTimeout(showPlayerScore, 300);
        })
        .catch(() => setFeedback("Network error while skipping question.", "error"))
        .finally(() => {
            isSubmitting = false;
            setButtonsEnabled(true);
        });
}

// geolocation
function sendLocationAndAnswerQuestion() {
    if (!navigator.geolocation) {
        setFeedback("Geolocation is not supported by your browser.", "error");
        isSubmitting = false;
        setButtonsEnabled(true);
        return;
    }

    setFeedback("Location required — getting your location...", "info");
    navigator.geolocation.getCurrentPosition(showPosition, () => {
        setFeedback("Location permission denied or failed.", "error");
        isSubmitting = false;
        setButtonsEnabled(true);
        const submitBtn = document.getElementById("submit");
        if (submitBtn) submitBtn.textContent = "Check";
    });
}

function showPosition(position) {
    fetch(`https://codecyprus.org/th/api/location?session=${session}&latitude=${position.coords.latitude}&longitude=${position.coords.longitude}`)
        .then(response => response.json())
        .then(jsonObject => {
            if (jsonObject.status === "OK") {
                locationSentQuestion = true;
                // Continue original flow: re-submit answer after location is sent
                submitAnswers();
            } else {
                setFeedback(jsonObject.message || "Could not send location.", "error");
                isSubmitting = false;
                setButtonsEnabled(true);
                const submitBtn = document.getElementById("submit");
                if (submitBtn) submitBtn.textContent = "Check";
            }
        })
        .catch(() => {
            setFeedback("Network error while sending location.", "error");
            isSubmitting = false;
            setButtonsEnabled(true);
            const submitBtn = document.getElementById("submit");
            if (submitBtn) submitBtn.textContent = "Check";
        });
}

// QR code reader
var opts = {
    continuous: true,
    video: document.getElementById('preview'),
    mirror: true,
    captureImage: false,
    backgroundScan: true,
    refractoryPeriod: 5000,
    scanPeriod: 1
};

let scanner = new Instascan.Scanner(opts);
scanner.addListener('scan', function (content) {
    console.log(content);
    document.getElementById("content").innerHTML = content;
    setFeedback("Hint scanned ✅", "success");
});

Instascan.Camera.getCameras().then(function (cameras) {
    if (cameras.length === 0) {
        document.getElementById("content").innerHTML = "No cameras found.";
        return;
    }

    cameraArray = cameras;
    cameraIndex = cameras.length - 1;

    scanner.start(cameraArray[cameraIndex]);
}).catch(function (e) {
    document.getElementById("content").innerHTML = "Camera error: " + e;
});

// optional switch camera (still here)
function switchCamera() {
    if (cameraIndex < cameraArray.length - 1) cameraIndex++;
    else cameraIndex = 0;

    scanner.start(cameraArray[cameraIndex]);
}

// start page
getQuestions();
showPlayerScore();
</script>

<footer id="footer"></footer>

</body>
</html>
